<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220">
  <!-- Background (Clean white) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <g transform="translate(0, 25)">
    
    <!-- ========================================== -->
    <!-- SOLID TECH LETTERS (E, X, T, A, M, I)      -->
    <!-- All gaps are exactly 15 pixels             -->
    <!-- Bottom edges rest precisely at Y=120       -->
    <!-- ========================================== -->
    <g fill="#0A2540">
      <rect x="178" y="20" width="24" height="100" />
      <rect x="202" y="20" width="46" height="24" />
      <rect x="202" y="58" width="36" height="24" />
      <rect x="202" y="96" width="46" height="24" />
      <polygon points="263,20 291,20 333,120 305,120" />
      <polygon points="333,20 305,20 263,120 291,120" />
      <rect x="348" y="20" width="70" height="24" />
      <rect x="371" y="44" width="24" height="76" />
      <rect x="530" y="20" width="24" height="100" />
      <rect x="570" y="20" width="24" height="100" />
      <rect x="530" y="20" width="64" height="24" />
      <rect x="530" y="60" width="64" height="24" />
      <path d="M 609 120 V 20 H 633 L 654 70 L 675 20 H 699 V 120 H 675 V 55 L 654 100 L 633 55 V 120 Z" />
      <rect x="714" y="20" width="24" height="100" />
    </g>

    <!-- ========================================== -->
    <!-- CIRCUITRY LETTERS (N, G, S)                -->
    <!-- Bottom edges rest precisely at Y=116       -->
    <!-- (Center of 6px stroke = visual 120 edge)   -->
    <!-- ========================================== -->
    <g fill="none" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt">
      <path d="M 85,116 L 85,24 L 141,116 L 141,24" stroke="#0066CC" />
      <path d="M 96,116 L 96,24 L 152,116 L 152,24" stroke="#F5A623" />
      <path d="M 107,116 L 107,24 L 163,116 L 163,24" stroke="#10B981" />
      
      <path d="M 515,24 L 433,24 L 433,116 L 515,116 L 515,59 L 474,59" stroke="#0066CC" />
      <path d="M 504,35 L 444,35 L 444,105 L 504,105 L 504,70 L 474,70" stroke="#F5A623" />
      <path d="M 493,46 L 455,46 L 455,94 L 493,94 L 493,81 L 474,81" stroke="#10B981" />
      
      <path d="M 835,24 L 753,24 L 753,59 L 813,59 L 813,94 L 775,94" stroke="#0066CC" />
      <path d="M 824,35 L 764,35 L 764,70 L 824,70 L 824,105 L 764,105" stroke="#F5A623" />
      <path d="M 813,46 L 775,46 L 775,81 L 835,81 L 835,116 L 753,116" stroke="#10B981" />
    </g>

    <!-- ========================================================================= -->
    <!-- MODULE SUBTITLE & TRICOLOR DATA WINGS                                     -->
    <!-- ========================================================================= -->
    
    <!-- Left Tech Wings (Tricolor) -->
    <!-- Extended inward strictly to X=423 to hug the 'A' tightly -->
    <g stroke-width="2">
      <line x1="82" y1="139" x2="423" y2="139" stroke="#0066CC" />
      <line x1="82" y1="145" x2="423" y2="145" stroke="#F5A623" />
      <line x1="82" y1="151" x2="423" y2="151" stroke="#10B981" />
    </g>
    
    <!-- PLATFORM MODULE NAME (CHANGE "ABS" TO "ERP", "CRM", ETC.) -->
    <!-- Letter spacing reduced to 3px to squeeze the A, B, and S together -->
    <text x="460" y="153" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="32" 
          font-weight="800" 
          fill="#0A2540" 
          text-anchor="middle"
          style="letter-spacing: 3px;">ABS</text>
          
    <!-- Right Tech Wings (Tricolor) -->
    <!-- Extended inward strictly to X=497 to hug the 'S' tightly -->
    <g stroke-width="2">
      <line x1="497" y1="139" x2="838" y2="139" stroke="#0066CC" />
      <line x1="497" y1="145" x2="838" y2="145" stroke="#F5A623" />
      <line x1="497" y1="151" x2="838" y2="151" stroke="#10B981" />
    </g>

  </g>
</svg>
